name: Anaqua
description: 'Anaqua provides intellectual property management (IPMS) software and services for corporations
  and law firms, unifying patent, trademark, and broader IP portfolio operations through process automation,
  business intelligence, and analytics. Its AQX platform (AQX Corporate, AQX Law Firm, AQX Pharma) is
  complemented by PATTSY WAVE portfolio analytics, AcclaimIP patent search, ideaPoint innovation management,
  and IP services such as annuity, renewal, foreign filing, and docketing. Clients include Adidas, ARM,
  TSMC, and GSK. Backed by Insight Partners and Bessemer Venture Partners, Anaqua does not currently publish
  a public developer API or portal; integration is handled via its SeeUnity application-integration technology.'
